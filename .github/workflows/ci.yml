# Checks without the game on every push and pull request: the scripts convert to cp1251 and the launcher builds
# with them inside, the launcher's link passes its own test (hello, a 2 MB save in pieces, chat, a lost partner),
# and tests/smoke.ps1 finds the versions in agreement and nothing left over. The engine (a fork of xray-monolith)
# is built and tested locally: its sources are not here, so the engine's checks of smoke.ps1 only warn.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scripts to cp1251, the launcher
        run: python -I build.py

      - name: The launcher's link test
        shell: pwsh
        run: |
          $exe = "launcher\bin\Release\net48\CoopLauncher.exe"
          $p = Start-Process $exe -ArgumentList '--selftest-loopback' -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the loopback test did not end in 2 minutes" }
          Get-Content "launcher\bin\Release\net48\selftest.txt"
          if ($p.ExitCode -ne 0 -or (Select-String "launcher\bin\Release\net48\selftest.txt" -Pattern '^FAIL' -Quiet)) {
            throw "the loopback test failed"
          }

      - name: Smoke checks
        shell: pwsh
        run: ./tests/smoke.ps1 -Engine "$env:RUNNER_TEMP\no-engine"
